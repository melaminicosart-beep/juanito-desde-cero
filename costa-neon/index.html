<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed WebGL film frame, cinematic letterbox, HUD floating in the safe area */
  :root {
    --ink: #07040d;
    --paper: #fff4ec;
    --neon-pink: #ff3d9a;
    --neon-cyan: #3ef2ff;
    --sunset: #ffb057;
    --muted: rgba(255, 244, 236, .62);
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --script: "Pacifico", "Brush Script MT", cursive;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .bar { position: fixed; left: 0; right: 0; height: min(11vh, max(0px, calc((100vh - 100vw / 2.39) / 2))); background: #000; z-index: 2; pointer-events: none; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }

  .card { position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; text-align: center; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; }
  .title { font-family: var(--display); font-size: clamp(56px, 13vw, 190px); line-height: 1.08; padding-top: .04em; letter-spacing: .01em; text-wrap: balance;
    background: linear-gradient(180deg, #fff3c4 0%, var(--sunset) 38%, var(--neon-pink) 78%, #b2177a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 rgba(40, 0, 40, .55)) drop-shadow(0 0 28px rgba(255, 61, 154, .45)); }
  .script { font-family: var(--script); font-size: clamp(26px, 5vw, 64px); color: #e9feff; margin-top: -.25em; transform: rotate(-6deg);
    text-shadow: 0 0 6px var(--neon-cyan), 0 0 18px var(--neon-cyan), 0 0 42px rgba(62, 242, 255, .7); }
  .kicker { font: 600 clamp(11px, 1.3vw, 14px)/1 var(--body); letter-spacing: .42em; text-transform: uppercase; color: var(--muted); margin-top: 2.2em; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

  .lower { position: fixed; z-index: 3; left: max(24px, env(safe-area-inset-left, 0px) + 16px); bottom: calc(min(11vh, max(0px, calc((100vh - 100vw / 2.39) / 2))) + 22px + env(safe-area-inset-bottom, 0px));
    opacity: 0; pointer-events: none; }
  .lower b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.2vw, 40px); letter-spacing: .03em; }
  .lower span { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--neon-cyan); }

  .hud { position: fixed; z-index: 3; top: calc(min(11vh, max(0px, calc((100vh - 100vw / 2.39) / 2))) + 18px + env(safe-area-inset-top, 0px));
    right: max(20px, env(safe-area-inset-right, 0px) + 16px); text-align: right; font-variant-numeric: tabular-nums; pointer-events: none; }
  .hud .clock { font-family: var(--display); font-size: clamp(26px, 3.4vw, 42px); letter-spacing: .04em; }
  .hud .meta { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
  .hud .speed { margin-top: 10px; font-family: var(--display); font-size: clamp(18px, 2.2vw, 26px); color: var(--neon-pink); }

  .controls { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px) + 12px); top: calc(min(11vh, max(0px, calc((100vh - 100vw / 2.39) / 2))) + 14px + env(safe-area-inset-top, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; transition: opacity .5s ease; }
  body.idle .controls { opacity: 0; }
  .controls button { font: 600 12px/1 var(--body); letter-spacing: .08em; color: var(--paper); background: rgba(10, 4, 20, .55); border: 1px solid rgba(255, 244, 236, .25);
    padding: 9px 13px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); }
  .controls button:hover { border-color: var(--neon-pink); }
  .controls button:focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { border-color: var(--neon-cyan); color: var(--neon-cyan); }

  .progress { position: fixed; z-index: 4; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: 3px; background: rgba(255,255,255,.08); }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sunset), var(--neon-pink), var(--neon-cyan)); }
  body.render .controls, body.render .progress { display: none; }

  #loading { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; background: var(--ink); font: 600 12px var(--body); letter-spacing: .4em; text-transform: uppercase; color: var(--muted); transition: opacity .8s; }
  #loading.gone { opacity: 0; pointer-events: none; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
'use strict';
const LOOP = 48;                       // seconds per film loop
const RENDER_MODE = /[?&#]render/.test(location.search + location.hash);
if (RENDER_MODE) document.body.classList.add('render');

const srgb = (h) => new THREE.Color(h).convertSRGBToLinear();
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const ease = (k) => k * k * k * (k * (k * 6 - 15) + 10);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const rand = rng(1337);

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: RENDER_MODE });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 9000);
scene.fog = new THREE.FogExp2(srgb('#f08a6a'), 0.0011);

// ---------- shared uniforms ----------
const U = {
  uTime: { value: 0 },
  uNight: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.45, 0.09, -0.89).normalize() },
  uSunCol: { value: new THREE.Color(1, 0.7, 0.5) },
  uAmb: { value: new THREE.Color(0.4, 0.3, 0.4) },
  fogColor: { value: scene.fog.color },
  fogDensity: { value: scene.fog.density },
};

const GLSL_NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
`;
const GLSL_SKY = `
uniform vec3 uSunDir; uniform float uNight; uniform float uTime;
vec3 skyColor(vec3 d){
  float h = d.y;
  vec3 zen = mix(vec3(.22,.16,.48), vec3(.03,.03,.12), uNight);
  vec3 mid = mix(vec3(.92,.42,.62), vec3(.26,.10,.36), uNight);
  vec3 hor = mix(vec3(1.0,.66,.40), vec3(.50,.16,.34), uNight);
  float sd = max(dot(d, uSunDir), 0.);
  hor = mix(hor, vec3(1.0,.80,.50), pow(sd, 6.) * (1. - uNight * .7));
  vec3 c = mix(hor, mid, smoothstep(0., .2, h));
  c = mix(c, zen, smoothstep(.16, .75, h));
  if (h < 0.) c = mix(hor, hor * .7, smoothstep(0., -.2, h));
  c += vec3(1.,.55,.3) * pow(sd, 48.) * .55 * (1. - uNight * .8);
  vec2 cp = d.xz / (max(h, 0.) + .1); cp.x += uTime * .015;
  float cl = smoothstep(.48, .85, fbm(cp * vec2(.35, 1.4))) * smoothstep(.0, .06, h) * (1. - smoothstep(.3, .55, h));
  vec3 cloud = mix(vec3(1.,.62,.62), vec3(.30,.12,.30), uNight) + vec3(1.,.55,.25) * pow(sd, 6.) * .9 * (1. - uNight);
  c = mix(c, cloud, cl * .8);
  vec3 sp = floor(d * 380.);
  float st = step(.9986, hash(sp.xy + sp.z * 7.13));
  c += st * smoothstep(.35, 1., uNight) * smoothstep(.06, .3, h);
  return pow(c, vec3(2.2));
}
`;
const GLSL_FOG = `
uniform vec3 fogColor; uniform float fogDensity;
vec3 applyFog(vec3 col, float dist){ float f = 1. - exp(-fogDensity*fogDensity*dist*dist); return mix(col, fogColor, clamp(f,0.,1.)); }
`;

// ---------- sky ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: GLSL_NOISE + GLSL_SKY + `
  varying vec3 vDir;
  void main(){
    vec3 d = normalize(vDir);
    vec3 c = skyColor(d);
    float ang = acos(clamp(dot(d, uSunDir), -1., 1.));
    float R = .055;
    float v = (d.y - uSunDir.y) / R;
    float cut = v < 0. ? step(fract(-v * 5.5 + .2), -v * .55) : 0.;
    float disc = smoothstep(R, R - .004, ang) * (1. - cut);
    vec3 sunCol = mix(vec3(1.,.95,.55), vec3(1.,.32,.55), clamp(.5 - v * .5, 0., 1.));
    c = mix(c, pow(sunCol, vec3(2.2)) * 1.5, disc * (1. - uNight * .5));
    gl_FragColor = vec4(c, 1.);
    #include <tonemapping_fragment>
  }`
}));
sky.renderOrder = -1;
scene.add(sky);

// ---------- ocean ----------
const oceanGeo = new THREE.PlaneGeometry(9000, 9000, 160, 160); oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `uniform float uTime; varying vec3 vW;
  void main(){ vec3 p = position;
    vec4 w = modelMatrix * vec4(p,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: GLSL_NOISE + GLSL_SKY + GLSL_FOG + `
  varying vec3 vW;
  vec3 waveN(vec2 p, float t){
    vec2 g = vec2(0.);
    vec4 W[6];
    W[0]=vec4(.9,.3,.22,1.1); W[1]=vec4(-.4,1.,.15,1.7); W[2]=vec4(.7,-.8,.09,2.6);
    W[3]=vec4(.2,1.,.06,4.1); W[4]=vec4(-.9,-.2,.04,6.3); W[5]=vec4(.5,.6,.025,9.7);
    for(int i=0;i<6;i++){ vec2 dir = normalize(W[i].xy); float k = W[i].w * .25; float a = W[i].z;
      float ph = dot(dir, p) * k + t * sqrt(9.8 * k);
      g += dir * a * k * cos(ph) * 1.6; }
    g += (vec2(fbm(p*.35 + t*.2), fbm(p*.35 - t*.17)) - .5) * .18;
    return normalize(vec3(-g.x, 1., -g.y));
  }
  void main(){
    vec3 toCam = cameraPosition - vW; float dist = length(toCam); vec3 V = toCam / dist;
    vec3 N = waveN(vW.xz, uTime);
    N = normalize(mix(N, vec3(0.,1.,0.), smoothstep(20., 420., dist) * .92));
    vec3 Rf = reflect(-V, N); Rf.y = abs(Rf.y) + .002;
    float fres = .03 + .97 * pow(1. - max(dot(N, V), 0.), 5.);
    vec3 refl = skyColor(normalize(Rf));
    vec3 deep = pow(mix(vec3(.05,.24,.32), vec3(.02,.04,.10), uNight), vec3(2.2));
    vec3 col = mix(deep, refl, clamp(fres + .1, 0., 1.));
    float sunUp = smoothstep(-.06, .03, uSunDir.y);
    float sp = pow(max(dot(Rf, uSunDir), 0.), 220.) * 6. + pow(max(dot(Rf, uSunDir), 0.), 18.) * .25;
    col += vec3(1.,.55,.3) * sp * sunUp * (1. - uNight * .6);
    float shore = -vW.z - 5.;
    float foam = (1. - smoothstep(0., 7., shore)) * smoothstep(.55, .75, sin(shore * 1.6 - uTime * 2.2 + fbm(vW.xz*.3)*3.) * .5 + .5 + fbm(vW.xz*.8)*.3);
    col = mix(col, vec3(.95,.85,.85) * (1. - uNight * .75), foam * .65);
    col = applyFog(col, dist * .55);
    gl_FragColor = vec4(col, 1.);
    #include <tonemapping_fragment>
  }`
}));
scene.add(ocean);

// ---------- beach sand ----------
{
  const g = new THREE.PlaneGeometry(4000, 52, 400, 52); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i) - 13; // -39..13
    const y = Math.max(-3, Math.min(0.45, (z + 5) * 0.12));
    p.setXYZ(i, p.getX(i), y, z);
  }
  g.computeVertexNormals();
  const sand = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: srgb('#e7c49a'), roughness: .95 }));
  sand.receiveShadow = true; scene.add(sand);
}

// ---------- road ----------
function roadTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#2b2a31'; x.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 9000; i++) { const v = 30 + Math.random() * 40; x.fillStyle = `rgba(${v},${v},${v + 6},.5)`; x.fillRect(Math.random() * 1024, Math.random() * 256, 2, 2); }
  x.fillStyle = '#e9e6dc'; x.fillRect(0, 10, 1024, 6); x.fillRect(0, 240, 1024, 6);
  x.fillStyle = '#f2c14e'; x.fillRect(0, 121, 1024, 5); x.fillRect(0, 131, 1024, 5);
  x.fillStyle = '#e9e6dc'; for (let i = 0; i < 2; i++) { x.fillRect(i * 512, 66, 260, 4); x.fillRect(i * 512, 188, 260, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.repeat.set(4000 / 28, 1); return t;
}
function lampPools(mat, k) {
  mat.onBeforeCompile = (s) => {
    s.uniforms.uNight = U.uNight;
    s.vertexShader = 'varying vec3 vWp;\n' + s.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vWp = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    s.fragmentShader = 'varying vec3 vWp; uniform float uNight;\n' + s.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float dxa = mod(vWp.x + 1500. + 18., 36.) - 18.;
      float dxb = mod(vWp.x + 1500., 36.) - 18.;
      float pa = exp(-(dxa*dxa + pow(vWp.z - 15.2, 2.) * 1.4) / 46.);
      float pb = exp(-(dxb*dxb + pow(vWp.z - 28.8, 2.) * 1.4) / 46.);
      totalEmissiveRadiance += diffuseColor.rgb * vec3(1., .62, .32) * (pa + pb) * uNight * ${k.toFixed(2)};
      totalEmissiveRadiance += diffuseColor.rgb * vec3(.35, .3, .55) * uNight * .12;`);
  };
  return mat;
}
const road = new THREE.Mesh(new THREE.PlaneGeometry(4000, 14).rotateX(-Math.PI / 2),
  lampPools(new THREE.MeshStandardMaterial({ map: roadTexture(), roughness: .55, metalness: .1 }), 2.6));
road.position.set(0, 0.46, 22); road.receiveShadow = true; scene.add(road);
for (const z of [14.1, 29.9]) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(4000, 0.55, 1.8), lampPools(new THREE.MeshStandardMaterial({ color: srgb('#cbbfb6'), roughness: .9 }), 1.6));
  s.position.set(0, 0.25, z); s.receiveShadow = true; scene.add(s);
}

// ---------- city ground with street grid ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(16000, 14000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: GLSL_NOISE + GLSL_FOG + `
  uniform vec3 uSunCol; uniform vec3 uAmb; uniform float uNight; varying vec3 vW;
  void main(){
    vec2 q = vec2(vW.x + 7., vW.z - 31.);
    vec2 f = fract(q / 60.) * 60.;
    float street = 1. - step(14., f.x) * step(14., f.y);
    float edge = (smoothstep(3., 0., abs(f.x - 1.5)) + smoothstep(3., 0., abs(f.x - 12.5)) + smoothstep(3., 0., abs(f.y - 1.5)) + smoothstep(3., 0., abs(f.y - 12.5))) * street;
    vec3 base = mix(vec3(.10,.12,.09), vec3(.09,.09,.10), street);
    base *= .8 + .4 * noise(vW.xz * .2);
    vec3 col = base * (uAmb + uSunCol * .55);
    col += vec3(1.,.55,.2) * edge * uNight * .55;
    col = applyFog(col, length(cameraPosition - vW));
    gl_FragColor = vec4(col, 1.);
    #include <tonemapping_fragment>
  }`
}));
ground.position.set(0, 0.3, 31 + 7000); scene.add(ground);

// ---------- buildings ----------
const DOWNTOWN = new THREE.Vector3(380, 0, 330);
const towers = [];
{
  const pastel = ['#f7a8c4', '#9fe3d0', '#c8b6f2', '#ffd59e', '#a8d8f7', '#f6c1a8'];
  const towerTones = ['#c9cfd8', '#a9b4c4', '#d8cbbb', '#8fa1b5', '#e2dcd2', '#b6c3c9', '#9aa6b8'];
  for (let bx = -1300; bx < 1300; bx += 60) {
    for (let bz = 45; bz < 1200; bz += 60) {
      const front = bz === 45;
      const n = front ? 2 : 1 + Math.floor(rand() * 3);
      for (let i = 0; i < n; i++) {
        const w = front ? 18 + rand() * 6 : 14 + rand() * 18;
        const d = front ? 16 + rand() * 8 : 14 + rand() * 18;
        const cx = bx + 14 + (front ? i * 23 + 2 : rand() * (46 - w)) + w / 2;
        const cz = bz + 2 + (front ? 0 : rand() * (44 - d)) + d / 2;
        const dd = Math.hypot(cx - DOWNTOWN.x, (cz - DOWNTOWN.z) * 1.3);
        let h = front ? 14 + rand() * 12 : 10 + rand() * 28 + 190 * Math.exp(-dd * dd / (2 * 170 * 170)) * (0.45 + rand() * 0.75);
        if (!front && rand() < .04) h += 60;
        const tone = front ? pastel[Math.floor(rand() * pastel.length)] : towerTones[Math.floor(rand() * towerTones.length)];
        towers.push({ x: cx, z: cz, w, d, h, color: srgb(tone), front });
      }
    }
  }
}
const bMat = new THREE.ShaderMaterial({
  uniforms: U, extensions: { derivatives: true },
  vertexShader: `
  varying vec3 vW; varying vec3 vN; varying vec3 vCol; varying float vSeed; varying float vTop;
  void main(){
    vec4 w = modelMatrix * instanceMatrix * vec4(position, 1.);
    vW = w.xyz; vN = normal;
    #ifdef USE_INSTANCING_COLOR
      vCol = instanceColor;
    #else
      vCol = vec3(1.);
    #endif
    vSeed = fract(sin(dot(instanceMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453);
    vTop = instanceMatrix[1].y;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`,
  fragmentShader: GLSL_NOISE + GLSL_FOG + `
  uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uAmb; uniform float uNight;
  varying vec3 vW; varying vec3 vN; varying vec3 vCol; varying float vSeed; varying float vTop;
  void main(){
    vec3 N = normalize(vN);
    float wall = 1. - step(.5, abs(N.y));

  fill.position.set(C.x, 3.2, C.z); fill.intensity = lerp(0, 3, night);
  sun.target.position.copy(C);
  sun.position.copy(C).addScaledVector(new THREE.Vector3(U.uSunDir.value.x, Math.max(U.uSunDir.value.y, .25), U.uSunDir.value.z).normalize(), 300);

  // HUD
  const mins = 18 * 60 + 50 + Math.round(t / LOOP * 95);
  clockEl.textContent = `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  skyEl.textContent = night < .35 ? 'Atardecer · 29 °C' : night < .75 ? 'Hora azul · 27 °C' : 'Noche · 26 °C';
  speedEl.textContent = `${Math.round(HERO_SPEED * 3.6 + Math.sin(t * .8) * 3)} km/h`;
  const showCard = (el, a, b, f, slide) => {
    const o = smooth(a, a + f, t) * (1 - smooth(b - f, b, t));
    el.style.opacity = o.toFixed(3);
    el.style.transform = slide ? `translateX(${((1 - o) * -16).toFixed(1)}px)` : `scale(${(1.05 - .05 * ease(clamp01((t - a) / (b - a)))).toFixed(4)})`;
  };
  showCard(cardIntro, 1.2, 7, 1.1, false);
  showCard(low1, 10, 15.6, .7, true);
  showCard(low2, 35.4, 40.6, .7, true);
  showCard(cardEnd, 42.8, 47.6, 1, false);
  prog.style.width = (t / LOOP * 100).toFixed(2) + '%';
}
const $ = (id) => document.getElementById(id);
const clockEl = $('clock'), skyEl = $('sky'), speedEl = $('speed'), prog = $('prog');
const cardIntro = $('cardIntro'), cardEnd = $('cardEnd'), low1 = $('low1'), low2 = $('low2');

function frame(t) {
  world(t);
  const fade = direct(t);
  grade.uniforms.uFade.value = fade; grade.uniforms.uTime.value = t;
  refreshEnv();
  composer.render();
}

// ---------- soundtrack (WebAudio, starts on click) ----------
let audio = null;
function makeSynth(ac, out) {
  const master = ac.createGain(); master.gain.value = .5; master.connect(out);
  const delay = ac.createDelay(); delay.delayTime.value = .36; const fb = ac.createGain(); fb.gain.value = .32;
  delay.connect(fb); fb.connect(delay); delay.connect(master);
  const beat = 60 / 96;
  const chords = [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62], [40, 47, 52, 55, 59]];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function note(freq, t0, dur, type, vol, cutoff, toDelay) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + Math.min(.4, dur * .3)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(master); if (toDelay) g.connect(delay); o.start(t0); o.stop(t0 + dur + .05);
  }
  function kick(t0) { const o = ac.createOscillator(); const g = ac.createGain(); o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + .25); g.gain.setValueAtTime(.7, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .3); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .32); }
  return {
    master, barLen: beat * 4,
    bar(next, n) {
      const ch = chords[n % 4];
      ch.slice(1).forEach(m => { note(mtof(m), next, beat * 4.2, 'sawtooth', .035, 1400, false); note(mtof(m + 12.07), next, beat * 4.2, 'triangle', .015, 2400, false); });
      for (let i = 0; i < 8; i++) note(mtof(ch[0] - 12 + (i % 2 ? 12 : 0)), next + i * beat / 2, beat / 2 * .9, 'square', .06, 520, false);
      if (n >= 1) for (let i = 0; i < 8; i++) note(mtof(ch[1 + (i * 3) % 4] + 12), next + i * beat / 2, beat / 2, 'triangle', .05, 3000, true);
      if (n >= 2) for (let i = 0; i < 4; i++) kick(next + i * beat);

}
function startAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const syn = makeSynth(ac, ac.destination);
  let n = 0, next = ac.currentTime + .1;
  const timer = setInterval(() => { while (next < ac.currentTime + .5) { syn.bar(next, n++); next += syn.barLen; } }, 120);
  return { ac, timer };
}
// Offline render of the soundtrack (used only for exporting the video)
window.__renderAudio = async () => {
  const sr = 44100, ac = new OfflineAudioContext(2, sr * LOOP, sr);
  const syn = makeSynth(ac, ac.destination);
  for (let n = 0, t = .05; t < LOOP; n++, t += syn.barLen) syn.bar(t, n);
  syn.master.gain.setValueAtTime(.5, LOOP - 2.5); syn.master.gain.linearRampToValueAtTime(0, LOOP - .1);
  const buf = await ac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), N = L.length;
  const bytes = new Uint8Array(44 + N * 4), dv = new DataView(bytes.buffer);
  const w = (o, str) => [...str].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); dv.setUint32(4, 36 + N * 4, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, N * 4, true);
  for (let i = 0; i < N; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let bin = ''; for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(bin);
};

// ---------- loop & controls ----------
let playing = true, filmT = 0, last = performance.now();
const btnPlay = $('btnPlay'), btnSound = $('btnSound');
btnPlay.onclick = () => { playing = !playing; btnPlay.textContent = playing ? 'Pausa' : 'Reproducir'; btnPlay.setAttribute('aria-pressed', String(!playing)); };
$('btnRestart').onclick = () => { filmT = 0; };
btnSound.onclick = () => {
  if (!audio) { audio = startAudio(); btnSound.setAttribute('aria-pressed', 'true'); return; }
  if (audio.ac.state === 'running') { audio.ac.suspend(); btnSound.setAttribute('aria-pressed', 'false'); }
  else { audio.ac.resume(); btnSound.setAttribute('aria-pressed', 'true'); }
};
$('btnFull').onclick = () => { const el = document.documentElement; (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => {}); };
let idleTimer = 0;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2600); };
addEventListener('pointermove', wake); addEventListener('keydown', (e) => { wake(); if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); } }); wake();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  grade.uniforms.uRes.value.set(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// Deterministic hook used for offline video rendering
window.__renderAt = (t) => { frame(t); return true; };

function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) filmT = (filmT + dt) % LOOP;
  frame(filmT);
  requestAnimationFrame(tick);
}
frame(0);
$('loading').classList.add('gone');
if (!RENDER_MODE) requestAnimationFrame((n) => { last = n; tick(n); });
window.__ready = true;
})();
</script>
